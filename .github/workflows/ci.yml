name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The detector depends on live registry data, so a weekly run catches
    # the case where npm changes a response shape and nothing else does.
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Unit tests (no network)
        run: npm test
      # Live checks run on one Node version only. Three matrix legs hitting
      # npm, PyPI and pypistats at the same second is how the suite
      # rate-limits itself and fails on a package that is fine.
      - name: Integration tests (live registry)
        if: matrix.node == '22.x'
        run: npm run test:online
        env:
          PKGTRUTH_TEST_ONLINE: '1'

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Gate our own dependencies
        run: node bin/pkgtruth.js scan . --fail-on danger
