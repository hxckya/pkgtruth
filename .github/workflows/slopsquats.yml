name: Slopsquat watch

# Regenerates SLOPSQUATS.md from scripts/seeds.txt every week. The report is
# the tool running on the ecosystem it exists for; nothing local is needed.
on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC, after the metrics run
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - name: Restore adoption cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pkgtruth
          key: pkgtruth-cache-${{ github.run_id }}
          restore-keys: pkgtruth-cache-
      - name: Keep last week's report for the diff
        run: cp SLOPSQUATS.md /tmp/slopsquats-previous.md
      - name: Hunt
        run: node scripts/hunt.mjs
      - name: Commit if changed
        id: commit
        run: |
          git config user.name  "slopsquat-watch"
          git config user.email "slopsquat-watch@users.noreply.github.com"
          git add SLOPSQUATS.md
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "no change"; exit 0; fi
          git commit -m "slopsquats: $(date -u +%F)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # A file that changes silently has no audience. Each week with a real
      # change becomes a Release: watchers see it, and the releases Atom feed
      # is something a person can subscribe to.
      - name: Publish the week's changes as a release
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/report-diff.mjs /tmp/slopsquats-previous.md SLOPSQUATS.md > /tmp/notes.md
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then echo "counts only; no names entered or left — no release"; exit 0; fi
          [ "$rc" -eq 0 ] || { echo "::error::report-diff failed ($rc)"; exit 1; }
          TAG="report-$(date -u +%F)"
          gh release create "$TAG" --target "$(git rev-parse HEAD)" \
            --title "Live slopsquats — $(date -u +%F)" --notes-file /tmp/notes.md
