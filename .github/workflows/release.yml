name: Release

on:
  push:
    tags: ["v*"]

# Both publishes authenticate by OIDC, so this repository holds no tokens.
# npm verifies the workflow identity through a Trusted Publisher configured
# on npmjs.com; the MCP Registry verifies it through github-oidc.
permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      # A broken release is worse than a late one — the whole suite runs first.
      - name: Test
        run: npm run test:online

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          SRV=$(node -p "require('./server.json').version")
          if [ "$TAG" != "$SRV" ]; then
            echo "Tag v$TAG does not match server.json version $SRV"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
